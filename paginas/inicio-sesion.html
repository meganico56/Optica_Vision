<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../estilos/estilo-auth.css">
    <title>Iniciar Sesión | Boutique de la Visión</title>

</head>
<body>
    <div class="inicio">
        <div class="logo">
            <img src="../imagenes/logos/logo-boutique.png"
            width="200" height="150"
            alt="Logo Boutique de la Visión">
        
        <button id="theme-toggle-btn" class="theme-toggle-btn" title="Alternar Modo Oscuro" style="margin-left: 15px; z-index: 9999;">
            <i class="fa-solid fa-moon"></i>
        </button>
    </div>
        <div class="formulario">
            <div class="titulo">                
                <h5>Bienvenido</h5>
                <a href="Inicio.html" class="btn-volver"><i class="fa-solid fa-arrow-left"></i> Volver</a>
            </div>
            <div class="subtitulo">
                <h1>Inicia sesión </h1>
            </div>
            <div class="input-group">
                <input type="email" id="username" class="username" placeholder="E-mail" required>
                <i class="fa-solid fa-envelope icon-left"></i>
            </div>
            <div class="input-group">
                <input type="password" id="password" class="password" placeholder="Contraseña" required>
                <i class="fa-solid fa-lock icon-left"></i>
                <i class="fa-solid fa-eye toggle-password" id="togglePassword"></i>
            </div>
            <button class="olvidar" type="button" onclick="window.location.href='rcontraseña.html'">¿Olvidaste tu contraseña?</button>
            <button class="iniciar" id="btnLogin" type="button">Iniciar sesión</button>
            
            <div class="divider">
                <span>o iniciar con</span>
            </div>
            
            <div class="social-login">
                <button class="google" type="button"><i class="fa-brands fa-google"></i> Google</button>
                <button class="facebook" type="button"><i class="fa-brands fa-facebook-f"></i> Facebook</button>
            </div>

            <div class="registro-link">
                <p>¿No tienes una cuenta?</p>
                <button class="registrar" type="button" onclick="window.location.href='registro-usuario.html'">Regístrate ahora</button>
            </div>
        </div>
    </div>
    <footer>
        <div class="copyright">
            <p>© 2024 Todos los derechos reservados.</p>
        </div>
    </footer>
    <script src="../scripts/autenticacion.js"></script>

<script src="../scripts/theme-toggle.js"></script>
</body>
</html>
