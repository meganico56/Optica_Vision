<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../estilos/global.css">
    <link rel="stylesheet" href="../estilos/estilo-auth.css">
    <title>Iniciar Sesión | Boutique de la Visión</title>

</head>
<body>
    <div class="inicio">
        <div class="logo">
            <img src="../imagenes/logos/logo-boutique.png"
            alt="Logo Boutique de la Visión">
        </div>
        <div class="formulario">
            <div class="titulo">                
                <h5>Bienvenido</h5>
            </div>
            <div class="subtitulo">
                <h1>Inicia sesión </h1>
            </div>
            <input type="email" id="username" class="username" placeholder="E-mail" required><br><br>
            <input type="password" id="password" class="password" placeholder="Contraseña" required><br><br>
            <button class="olvidar" type="submit">¿Olvidaste tu contraseña?</button>
            <p><button class="iniciar" type="submit">Iniciar sesión</button></p>
            <button class="registrar" type="button" onclick="window.location.href='registro-usuario.html'">Registrarse</button>
            <p>Iniciar sesión con otra cuenta</p>
            <button class="google" type="submit">Google</button>
            <button class="facebook" type="submit">Facebook</button>
        </div>
    </div>
    <footer>
        <div class="copyright">
            <p>© 2024 Todos los derechos reservados.</p>
        </div>
    </footer>
</body>
</html>
