<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../estilos/estilo-registro.css">
    <title>Registro de Usuario | Boutique de la Visión</title>

</head>
<body>
    <div class="inicio">
        <div class="logo">
            <img src="../imagenes/logos/logo-boutique.png"
            width="200" height="150"
            alt="Logo Boutique de la Visión">
        
        <button id="theme-toggle-btn" class="theme-toggle-btn" title="Alternar Modo Oscuro" style="margin-left: 15px; z-index: 9999;">
            <i class="fa-solid fa-moon"></i>
        </button>
    </div>
        <div class="formulario">
            <div class="titulo">                
                <h5>Bienvenido</h5>
                <a href="javascript:history.back()" class="btn-volver"><i class="fa-solid fa-arrow-left"></i> Volver</a>
            </div>
            <div class="subtitulo">
                <h1>Crea tu cuenta</h1>
            </div>

<div class="campos">

    <!-- Nombre y apellido -->
    <div class="fila">
        <input type="text" id="username" class="username" placeholder="Nombre" required>

        <input type="text" id="lastname" class="username" placeholder="Apellido" required>
    </div>

    <!-- Email y teléfono -->
    <div class="fila">
        <input type="email" id="email" class="username" placeholder="E-mail" required>

        <input type="tel" id="phone" class="username" placeholder="Teléfono" required>
    </div>

    <!-- Dirección y ciudad -->
    <div class="fila">
        <input type="text" id="address" class="username" placeholder="Dirección" required>

        <input type="text" id="city" class="username" placeholder="Ciudad" required>
    </div>

    <!-- Contraseña -->
    <input type="password" id="password" class="password" placeholder="Contraseña" required>

</div>

<button class="iniciar" type="submit">Crear Cuenta</button>

<button class="registrar" type="button"
    onclick="window.location.href='inicio-sesion.html'">
    ¿Ya tienes cuenta? Inicia sesión
</button>

<p>Registrarte con otra cuenta</p>

<button class="google" type="submit">Google</button>

<button class="facebook" type="submit">Facebook</button>

        </div>
    </div>
    <footer>
        <div class="copyright">
            <p>© 2024 Todos los derechos reservados.</p>
        </div>
    </footer>

<script src="../scripts/theme-toggle.js"></script>
</body>
</html>
