<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../estilos/inicio.css">
    <link rel="stylesheet" href="../estilos/estilo-carrito.css">
    <title>Carrito | Boutique de la Visión</title>
</head>
<body>
    <header class="navbar">
        <div class="logo">
            <a href="inicio.html"><img src="../imagenes/logos/logo-boutique.png" class="logo-icon" alt="Boutique de la Visión"></a>
        </div>

        <form class="buscador" action="catalogo.html" method="get" role="search">
            <input type="text" name="q" placeholder="Buscar productos..." class="busc" aria-label="Buscar productos">
            <button type="submit" class="bot_bus" aria-label="Buscar"><i class="fa-solid fa-magnifying-glass"></i></button>
        </form>

        <input type="checkbox" id="menu-toggle" class="menu-toggle">
        <label for="menu-toggle" class="hamburguesa" aria-label="Abrir menú"><span></span><span></span><span></span></label>

        <nav>
            <ul class="navbar-menu">
                <li><a href="inicio.html">INICIO</a></li>
                <li><a href="catalogo.html">CATÁLOGO</a></li>
                <li><a href="agendar-cita.html">AGENDAR CITA</a></li>
                <li><a href="carrito.html" class="activo" aria-label="Carrito"><i class="fa-solid fa-cart-shopping"></i><span class="cart-count" id="cartBadge" hidden>0</span></a></li>
                <li><a href="inicio-sesion.html">REGISTRO / LOGIN</a></li>
            </ul>
        </nav>
    </header>

    <div class="cart-header-wrapper">
        <h1 class="cart-title">Tu carrito</h1>
        <div class="stepper">
            <div class="step-item active"><div class="step-circle">1</div><div class="step-label">Carrito</div></div>
            <div class="step-item"><div class="step-circle">2</div><div class="step-label">Datos</div></div>
            <div class="step-item"><div class="step-circle">3</div><div class="step-label">Pago</div></div>
        </div>
    </div>

    <main class="cart-container">
        <section class="cart-items-section">
            <div class="cart-table-header">
                <div>Producto</div>
                <div>Cantidad</div>
                <div style="text-align: right;">Total</div>
            </div>

            <div id="listaCarrito"></div>

            <div class="carrito-vacio" id="carritoVacio" hidden>
                <i class="fa-solid fa-cart-shopping"></i>
                <h2>Tu carrito está vacío</h2>
                <p>Explora la colección y agrega tus favoritos.</p>
                <a href="catalogo.html" class="btn-primary">Ver catálogo</a>
            </div>
        </section>

        <aside class="cart-summary">
            <h2 class="summary-title">Resumen de compra</h2>

            <div class="summary-row"><span>Subtotal</span><span id="subtotal">$0</span></div>
            <div class="summary-row" id="filaEnvio" hidden><span>Envío</span><span id="envio">$0</span></div>
            <div class="summary-row discount" id="filaDescuento" hidden><span>Descuento</span><span id="descuento">-$0</span></div>

            <div class="promo-code">
                <input type="text" class="promo-input" placeholder="Código de descuento" id="codigoPromo" autocomplete="off">
                <button class="promo-btn" id="btnPromo" type="button">Aplicar</button>
            </div>
            <p class="mensaje-promo" id="mensajePromo" role="status" hidden></p>

            <div class="summary-total"><span>Total</span><span id="total">$0</span></div>

            <button class="checkout-btn" id="btnCheckout" type="button" disabled>
                Continuar al pago <i class="fa-solid fa-arrow-right"></i>
            </button>

            <div class="security-badges">
                <i class="fa-brands fa-cc-visa"></i>
                <i class="fa-brands fa-cc-mastercard"></i>
                <i class="fa-solid fa-lock"></i>
            </div>
        </aside>
    </main>

    <template id="tplItemCarrito">
        <div class="cart-item">
            <div class="item-details">
                <div class="item-image-wrapper"><img src="" alt=""></div>
                <div class="item-info">
                    <h3></h3>
                    <p class="item-marca"></p>
                    <button class="remove-btn" type="button" data-accion="eliminar"><i class="fa-solid fa-trash-can"></i> Eliminar</button>
                </div>
            </div>
            <div class="item-quantity">
                <button class="qty-btn" type="button" data-accion="menos" aria-label="Menos"><i class="fa-solid fa-minus"></i></button>
                <input type="text" class="qty-input" value="1" readonly aria-label="Cantidad">
                <button class="qty-btn" type="button" data-accion="mas" aria-label="Más"><i class="fa-solid fa-plus"></i></button>
            </div>
            <div class="item-price"></div>
        </div>
    </template>

    <script src="../scripts/api.js"></script>
    <script src="../scripts/sesion.js"></script>
    <script src="../scripts/carrito.js"></script>
    <script src="../scripts/pagina-carrito.js"></script>
</body>
</html>
