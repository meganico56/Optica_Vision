<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | Boutique de la Visión</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="../estilos/estilo-auth.css">
</head>
<body>
    <div class="inicio">
        <div class="logo">
            <img src="../imagenes/logos/logo-boutique.png" width="200" height="150" alt="Logo Boutique de la Visión">
        </div>

        <form class="formulario" id="formLogin" novalidate>
            <div class="titulo">
                <h5>Bienvenido</h5>
                <a href="inicio.html" class="btn-volver"><i class="fa-solid fa-arrow-left"></i> Volver</a>
            </div>
            <div class="subtitulo">
                <h1>Inicia sesión</h1>
            </div>

            <div class="input-group">
                <input type="email" id="correo" name="correo" class="username" placeholder="Correo electrónico" autocomplete="email" required>
                <i class="fa-solid fa-envelope icon-left"></i>
            </div>
            <div class="input-group">
                <input type="password" id="contrasena" name="contrasena" class="password" placeholder="Contraseña" autocomplete="current-password" required>
                <i class="fa-solid fa-lock icon-left"></i>
                <i class="fa-solid fa-eye toggle-password" id="togglePassword"></i>
            </div>

            <p class="mensaje-error" id="mensajeError" role="alert" hidden></p>

            <button class="olvidar" type="button" onclick="window.location.href='recuperar-contrasena.html'">¿Olvidaste tu contraseña?</button>
            <button class="iniciar" id="btnLogin" type="submit">Iniciar sesión</button>

            <div class="registro-link">
                <p>¿No tienes una cuenta?</p>
                <button class="registrar" type="button" onclick="window.location.href='registro-usuario.html'">Regístrate ahora</button>
            </div>
        </form>
    </div>

    <footer>
        <div class="copyright">
            <p>© 2026 Boutique de la Visión. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="../scripts/api.js"></script>
    <script src="../scripts/sesion.js"></script>
    <script src="../scripts/autenticacion.js"></script>
</body>
</html>
