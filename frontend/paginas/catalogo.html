<!doctype html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet"></noscript>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">
    <noscript><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"></noscript>
    <link rel="stylesheet" href="../estilos/catalogo.css">
    <title>Catálogo | Boutique de la Visión</title>
    <link rel="stylesheet" href="../estilos/footer.css" />
  </head>
<body>
    <div id="header"></div>

    <main class="catalogo_G">
        <img src="../imagenes/fondos/fondo-boutique.png" class="imag_fond">

        <div class="catalogo_cont">
            <p class="estado-lista" id="estadoLista" role="status">Cargando productos…</p>

            <div id="contenidoCatalogo" hidden>
                <ul class="botons" id="filtros">
                    <li><a href="#" class="activo" data-filtro="todos">Todos</a></li>
                    <li><a href="#" data-filtro="genero:Mujer">Mujer</a></li>
                    <li><a href="#" data-filtro="genero:Hombre">Hombre</a></li>
                    <li><a href="#" data-filtro="genero:Infantil">Niños</a></li>
                    <li><a href="#" data-filtro="categoria:Accesorios">Accesorios</a></li>
                </ul>

                <div class="titulo-pagina">
                    <h1>Catálogo</h1>
                    <p class="resumen-busqueda" id="resumenBusqueda" hidden></p>
                </div>

                <section class="contenedor-productos" id="listaProductos"></section>
            </div>
        </div>
    </main>

    <template id="tplProducto">
        <article class="producto-card">
            <div class="producto-imagen">
                <a class="enlace-producto" href="#"><img class="img-producto" src="" width="200" loading="lazy"></a>
                <span class="badge-agotado" hidden>Agotado</span>
            </div>
            <div class="producto-info">
                <h3><a class="enlace-producto nombre-producto" href="#"></a></h3>
                <p class="precio"></p>
                <p class="existencia"></p>
            </div>
            <button class="btn-carrito1" type="button" data-accion="comprar">Comprar ahora <i class="fa-solid fa-credit-card"></i></button>
            <button class="btn-carrito" type="button" data-accion="agregar">Agregar al carrito <i class="fa-solid fa-cart-plus"></i></button>
        </article>
    </template>

<div id="footer"></div>

<script src="../scripts/header.js"></script>
            <script src="../scripts/footer.js"></script>
<script src="../scripts/api.js"></script>
    <script src="../scripts/sesion.js"></script>
    <script src="../scripts/session-manager.js?v=profile-avatar-roles"></script>
    <script src="../scripts/carrito.js"></script>
    <script src="../scripts/catalogo.js"></script>
    <script src="../scripts/intro-animacion.js"></script>
  </body>
</html>
