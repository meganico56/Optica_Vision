<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="StyleLogin.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <title>Document</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Kantumruy+Pro:ital,wght@0,100..700;1,100..700&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">

</head>
<body>
    <div class="inicio">
        <div class="logo">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcT8dCd9fcU_QG2hxKOspG8KBzHNJaMciNDKAg&s"
            width="400" height="140"
            alt="Logo"
            width="200" height="70">
        </div>
        <div class="formulario">
            <div class="titulo">                
                <h5>Bienvenido</h5>
            </div>
            <div class="subtitulo">
                <h1>Crea tu cuenta</h1>
            </div>
            <input type="text" id="username" class="username" placeholder="Nombre" required><br><br>
            <input type="email" id="email" class="username" placeholder="E-mail" required><br><br>
            <input type="password" id="password" class="password" placeholder="Contraseña" required><br><br>
            <button class="iniciar" type="submit">Crear Cuenta</button>
            <p>Registrarte con otra cuenta</p>
            <button class="google" type="submit">Google</button>
            <button class="facebook" type="submit">Facebook</button>
        </div>
    </div>
    <footer>
        <div class="copyright">
            <p>© 2024 Todos los derechos reservados.</p>
        </div>
    </footer>
</body>
</html>
